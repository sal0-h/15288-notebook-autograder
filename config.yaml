# Example config only.
#
# Runtime configs live under output/{assignment_name}/config.yaml.
# The web UI does not read this file automatically.

assignment_name: Example_Assignment
model: gpt-5-mini
rubric_model: ""
rubric_review: true
include_reference_in_grading: false
solution_notebook: path/to/solution.ipynb
output_dir: output
workers: 1
max_prompt_tokens: 80000
max_completion_tokens: 4096

parsing:
  section_regex: '(?m)^\s*#\s*<font[^>]*>\s*(\d+)\b'
  question_regex: '(?i)^\s*(-\s*)?Q(\d+)\.(\d+)\s*.*?\[\s*(\d+)\s*PTS\s*\]'
  keep_images: true

grading:
  question_groups: []
  grade_only: null
  grade_only_merge: false

rubrics: {}
